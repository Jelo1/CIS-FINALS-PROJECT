<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Quiz | Study Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Study Hub</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="todo.html">To-Do</a>
        <a href="timer.html">Timer</a>
        <a href="quiz.html" class="active">Quiz</a>
        <a href="gpa.html">GPA</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <h1>Quick Quiz</h1>
    <p>Web development basics. Pick an answer for each question.</p>

    <div id="quiz-box" class="quiz-box">
      <p id="quiz-progress" class="quiz-progress"></p>
      <h2 id="quiz-question" class="quiz-question"></h2>
      <div id="quiz-options" class="quiz-options"></div>
      <p id="quiz-feedback" class="quiz-feedback" aria-live="polite"></p>
      <button id="quiz-next" class="btn" type="button" hidden>Next</button>
    </div>

    <div id="quiz-result" class="quiz-box" hidden>
      <h2>Quiz finished</h2>
      <p id="quiz-score" class="quiz-score"></p>
      <button id="quiz-restart" class="btn" type="button">Try again</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><p>&copy; <span id="year"></span> Study Hub. Built by our group.</p></div>
  </footer>
  <script src="js/main.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
